<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}8-Channel Factory{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">8C</span>
    <span class="brand-name">Content Factory</span>
  </div>
  <div class="topbar-right">
    <span class="muted">Local</span>
  </div>
</header>

<nav class="tabs">
  <a href="/"          class="tab {% if page == 'dashboard' %}active{% endif %}">Dashboard</a>
  <a href="/channels"  class="tab {% if page == 'channels'  %}active{% endif %}">Channels</a>
  <a href="/review"    class="tab {% if page == 'review'    %}active{% endif %}">Review</a>
  <a href="/upload"    class="tab {% if page == 'upload'    %}active{% endif %}">Upload</a>
  <a href="/history"   class="tab {% if page == 'history'   %}active{% endif %}">History</a>
  <a href="/schedule"  class="tab {% if page == 'schedule'  %}active{% endif %}">Schedule</a>
  <a href="/cleanup"   class="tab {% if page == 'cleanup'   %}active{% endif %}">Cleanup</a>
  <a href="/guide"     class="tab {% if page == 'guide'     %}active{% endif %}">Guide</a>
</nav>

<main class="container">
  {% block content %}{% endblock %}
</main>

<div id="toast" class="toast"></div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
